<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>چت‌بات</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #212121;
    --sidebar: #171717;
    --surface: #2f2f2f;
    --surface-hover: #3a3a3a;
    --text: #ececec;
    --text-muted: #9a9a9a;
    --border: #3a3a3a;
    --accent: #10a37f;
    --user-bubble: #2f2f2f;
    --bot-bubble: transparent;
  }
  html, body {
    height: 100%;
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  .app {
    display: flex;
    height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 260px;
    background: var(--sidebar);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 8px;
    transition: transform 0.3s ease;
  }
  .sidebar.hidden { transform: translateX(100%); }
  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    transition: background 0.2s;
  }
  .new-chat-btn:hover { background: var(--surface); }
  .chat-list {
    margin-top: 16px;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chat-item {
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .chat-item:hover, .chat-item.active { background: var(--surface); }
  .chat-item .del {
    opacity: 0;
    background: transparent;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .chat-item:hover .del { opacity: 1; }
  .chat-item .del:hover { background: #555; color: #fff; }

  .sidebar-footer {
    padding: 10px;
    font-size: 12px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .topbar {
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .topbar h1 {
    font-size: 16px;
    font-weight: 500;
  }
  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { background: var(--surface); }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
  }
  .messages-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .welcome {
    text-align: center;
    margin-top: 20vh;
    color: var(--text);
  }
  .welcome h2 {
    font-size: 28px;
    font-weight: 500;
    margin-bottom: 8px;
  }
  .welcome p { color: var(--text-muted); }

  .msg {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 600;
  }
  .avatar.user { background: #5436da; color: #fff; }
  .avatar.bot { background: var(--accent); color: #fff; }
  .msg-body {
    flex: 1;
    min-width: 0;
    padding-top: 4px;
  }
  .msg-role {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .msg-content {
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .msg-content code {
    background: #1a1a1a;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 13px;
  }

  .typing-dots {
    display: inline-flex;
    gap: 4px;
  }
  .typing-dots span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input */
  .input-area {
    padding: 12px 20px 20px;
  }
  .input-wrap {
    max-width: 760px;
    margin: 0 auto;
    background: var(--surface);
    border-radius: 24px;
    padding: 10px 12px 10px 14px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    border: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .input-wrap:focus-within { border-color: #555; }
  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    resize: none;
    max-height: 200px;
    line-height: 1.5;
    padding: 8px 4px;
  }
  textarea::placeholder { color: var(--text-muted); }
  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #fff;
    color: #000;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, opacity 0.2s;
    flex-shrink: 0;
  }
  .send-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
  .send-btn:not(:disabled):hover { background: #ddd; }

  .status {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 6px;
    min-height: 16px;
  }
  .status.error { color: #ff6b6b; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #555; }

  /* Mobile */
  @media (max-width: 768px) {
    .sidebar {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      z-index: 10;
      transform: translateX(100%);
    }
    .sidebar.open { transform: translateX(0); }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <button class="new-chat-btn" id="newChatBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      گفتگوی جدید
    </button>
    <div class="chat-list" id="chatList"></div>
    <div class="sidebar-footer">
      تاریخچه در مرورگر ذخیره می‌شود
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="icon-btn" id="toggleSidebar" title="منو">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <h1 id="chatTitle">گفتگوی جدید</h1>
    </div>

    <div class="messages" id="messages">
      <div class="messages-inner" id="messagesInner">
        <div class="welcome" id="welcome">
          <h2>سلام 👋</h2>
          <p>چطور می‌تونم کمکت کنم؟</p>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="پیام خود را بنویسید..."></textarea>
        <button class="send-btn" id="sendBtn" disabled title="ارسال">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 19V5M5 12l7-7 7 7"/>
          </svg>
        </button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </main>
</div>

<script>
/* =========================================================
   تنظیمات
   ========================================================= */
const ENDPOINT_URL = 'http://localhost:3000/embed.php'; // ← آدرس endpoint خودت رو اینجا بذار
const STORAGE_KEY = 'chatbot_conversations_v1';

/* =========================================================
   State
   ========================================================= */
let conversations = loadConversations();
let currentId = null;

function loadConversations() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function saveConversations() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
}
function getConversation(id) {
  return conversations.find(c => c.id === id);
}
function createConversation() {
  const conv = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    title: 'گفتگوی جدید',
    messages: [], // {role: 'user'|'assistant', content: string}
    createdAt: Date.now()
  };
  conversations.unshift(conv);
  saveConversations();
  return conv;
}

/* =========================================================
   DOM
   ========================================================= */
const $messages = document.getElementById('messages');
const $messagesInner = document.getElementById('messagesInner');
const $input = document.getElementById('input');
const $sendBtn = document.getElementById('sendBtn');
const $chatList = document.getElementById('chatList');
const $newChatBtn = document.getElementById('newChatBtn');
const $toggleSidebar = document.getElementById('toggleSidebar');
const $sidebar = document.getElementById('sidebar');
const $chatTitle = document.getElementById('chatTitle');
const $status = document.getElementById('status');
const $welcome = document.getElementById('welcome');

/* =========================================================
   Render
   ========================================================= */
function renderChatList() {
  $chatList.innerHTML = '';
  conversations.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.id === currentId ? ' active' : '');
    item.innerHTML = `
      <span style="overflow:hidden;text-overflow:ellipsis;">${escapeHtml(c.title)}</span>
      <button class="del" title="حذف">✕</button>
    `;
    item.addEventListener('click', (e) => {
      if (e.target.classList.contains('del')) {
        e.stopPropagation();
        deleteConversation(c.id);
      } else {
        switchConversation(c.id);
      }
    });
    $chatList.appendChild(item);
  });
}

function renderMessages() {
  const conv = getConversation(currentId);
  $messagesInner.innerHTML = '';
  if (!conv || conv.messages.length === 0) {
    $messagesInner.appendChild($welcome);
    return;
  }
  conv.messages.forEach(m => appendMessageToDOM(m.role, m.content));
  scrollToBottom();
}

function appendMessageToDOM(role, content) {
  // حذف welcome اگه وجود داره
  const w = $messagesInner.querySelector('.welcome');
  if (w) w.remove();

  const msg = document.createElement('div');
  msg.className = 'msg';
  const isUser = role === 'user';
  msg.innerHTML = `
    <div class="avatar ${isUser ? 'user' : 'bot'}">${isUser ? 'ش' : '✦'}</div>
    <div class="msg-body">
      <div class="msg-role">${isUser ? 'شما' : 'دستیار'}</div>
      <div class="msg-content"></div>
    </div>
  `;
  msg.querySelector('.msg-content').textContent = content;
  $messagesInner.appendChild(msg);
  scrollToBottom();
  return msg;
}

function appendTypingIndicator() {
  const w = $messagesInner.querySelector('.welcome');
  if (w) w.remove();

  const msg = document.createElement('div');
  msg.className = 'msg';
  msg.id = 'typingIndicator';
  msg.innerHTML = `
    <div class="avatar bot">✦</div>
    <div class="msg-body">
      <div class="msg-role">دستیار</div>
      <div class="msg-content">
        <span class="typing-dots"><span></span><span></span><span></span></span>
      </div>
    </div>
  `;
  $messagesInner.appendChild(msg);
  scrollToBottom();
}
function removeTypingIndicator() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

function scrollToBottom() {
  $messages.scrollTop = $messages.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

/* =========================================================
   Chat actions
   ========================================================= */
function switchConversation(id) {
  currentId = id;
  const conv = getConversation(id);
  $chatTitle.textContent = conv ? conv.title : 'گفتگوی جدید';
  renderMessages();
  renderChatList();
}

function deleteConversation(id) {
  conversations = conversations.filter(c => c.id !== id);
  saveConversations();
  if (currentId === id) {
    currentId = null;
    if (conversations.length) switchConversation(conversations[0].id);
    else {
      const conv = createConversation();
      switchConversation(conv.id);
    }
  } else {
    renderChatList();
  }
}

$newChatBtn.addEventListener('click', () => {
  const conv = createConversation();
  switchConversation(conv.id);
  $input.focus();
});

$toggleSidebar.addEventListener('click', () => {
  $sidebar.classList.toggle('open');
});

/* =========================================================
   Input handling
   ========================================================= */
$input.addEventListener('input', () => {
  $input.style.height = 'auto';
  $input.style.height = Math.min($input.scrollHeight, 200) + 'px';
  $sendBtn.disabled = $input.value.trim().length === 0;
});

$input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});

$sendBtn.addEventListener('click', handleSend);

/* =========================================================
   Send & API
   ========================================================= */
async function handleSend() {
  const text = $input.value.trim();
  if (!text) return;

  // ایجاد گفتگو در صورت نیاز
  if (!currentId) {
    const conv = createConversation();
    switchConversation(conv.id);
  }
  const conv = getConversation(currentId);

  // آپدیت عنوان با اولین پیام
  if (conv.messages.length === 0) {
    conv.title = text.slice(0, 40) + (text.length > 40 ? '...' : '');
    $chatTitle.textContent = conv.title;
    renderChatList();
  }

  // اضافه کردن پیام کاربر
  conv.messages.push({ role: 'user', content: text });
  appendMessageToDOM('user', text);

  // پاک کردن input
  $input.value = '';
  $input.style.height = 'auto';
  $sendBtn.disabled = true;

  // نشانگر تایپ
  appendTypingIndicator();
  setBusy(true);
  setStatus('در حال ارسال به سرور...');

  try {
    // ارسال کل تاریخچه به endpoint
    const payload = {
      conversation_id: conv.id,
      timestamp: new Date().toISOString(),
      messages: conv.messages // شامل پیام کاربر فعلی
    };

    const response = await fetch(ENDPOINT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) throw new Error('HTTP ' + response.status);

    const data = await response.json();
    // فرض می‌کنیم سرور پاسخ رو در فیلد `reply` یا `message` یا `response` برمی‌گردونه
    const botReply = data.reply || data.message || data.response || data.answer || '';

    if (!botReply) throw new Error('پاسخ خالی از سرور');

    removeTypingIndicator();
    conv.messages.push({ role: 'assistant', content: botReply });
    appendMessageToDOM('assistant', botReply);
    saveConversations();
    setStatus('');
  } catch (err) {
    removeTypingIndicator();
    // در صورت خطا، پیام آخر (کاربر) رو نگه می‌داریم تا کاربر بتونه دوباره تلاش کنه
    console.error(err);
    setStatus('خطا در ارتباط با سرور: ' + err.message, true);

    // برای تست، یه پاسخ mock می‌ذاریم (می‌تونی حذفش کنی)
    const mockReply = '⚠️ اتصال به سرور برقرار نشد. لطفاً ENDPOINT_URL را بررسی کن.';
    conv.messages.push({ role: 'assistant', content: mockReply });
    appendMessageToDOM('assistant', mockReply);
    saveConversations();
  } finally {
    setBusy(false);
  }
}

function setBusy(busy) {
  $sendBtn.disabled = busy || $input.value.trim().length === 0;
  $input.disabled = busy;
}
function setStatus(text, isError = false) {
  $status.textContent = text;
  $status.classList.toggle('error', isError);
}

/* =========================================================
   Init
   ========================================================= */
(function init() {
  if (conversations.length === 0) {
    const conv = createConversation();
    currentId = conv.id;
  } else {
    currentId = conversations[0].id;
  }
  renderChatList();
  renderMessages();
  $input.focus();
})();
</script>
</body>
</html>
